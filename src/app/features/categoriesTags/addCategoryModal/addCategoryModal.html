<div class="modal-backdrop" (click)="close()">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="new-item-title" (click)="$event.stopPropagation()">
    <header>
      <h2 id="new-item-title">New {{ itemType }}</h2>
      <button class="close-button" type="button" aria-label="Close" (click)="close()">×</button>
    </header>

    <form [formGroup]="form" (ngSubmit)="save()">
      <label for="new-item-name">Name</label>
      <input id="new-item-name" type="text" formControlName="name" autocomplete="off" required />

      @if (form.controls.name.touched && form.controls.name.invalid) {
        <p class="error" role="alert">A name is required.</p>
      }
      @if (error) {
        <p class="error" role="alert">{{ error }}</p>
      }

      <footer>
        <button class="cancel-button" type="button" [disabled]="isSaving" (click)="close()">Cancel</button>
        <button class="save-button" type="submit" [disabled]="isSaving">{{ isSaving ? 'Saving…' : 'Save' }}</button>
      </footer>
    </form>
  </section>
</div>
