<main class="register-page">
  <section class="register-card" aria-labelledby="register-heading">
    <h1 id="register-heading">Create your account</h1>
    <p class="intro">Start managing your finances in one place.</p>

    <form class="register-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" required />
      </div>

      <div class="form-field">
        <label for="email">Email address</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" required />
      </div>

      <div class="form-field">
        <label for="repeat-password">Repeat password</label>
        <input id="repeat-password" type="password" formControlName="repeatPassword" autocomplete="new-password" required />
      </div>

      @if (registerForm.hasError('passwordMismatch') && registerForm.controls.repeatPassword.touched) {
        <p class="register-error" role="alert">Passwords don't match</p>
      }

      @if (registerError) {
        <p class="register-error" role="alert">{{ registerError }}</p>
      }

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="login-prompt">Already have an account? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
