<main class="login-page">
  <section class="login-card" aria-labelledby="login-heading">
    <h1 id="login-heading">Finance App</h1>
    @if (registrationSuccess) {
      <p class="registration-success" role="status">Registered successfully!</p>
    }
    <p class="intro">Sign in to manage your finances.</p>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Email address</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" required />
      </div>

      @if (loginError) {
        <p class="login-error" role="alert">{{ loginError }}</p>
      }

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="register-prompt">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
  </section>
</main>
